<title>신경망 모델 구현하기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gamja+Flower&family=Hi+Melody&family=Caveat:wght@400;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Indie+Flower&family=Shadows+Into+Light&family=Nanum+Brush+Script&text=0123456789&display=block">
<style>
/* Layout: one phone-width column on graph paper; level map of 4 textbook stages; sticky level header + fixed action bar */
:root{
  --paper:#EAEFF4; --grid:rgba(22,32,58,.06); --surface:#FFFFFF; --sunk:#F3F6F9;
  --ink:#16203A; --muted:#5A6579; --line:#D2D9E2;
  --accent:#EE6418; --accent-soft:#FFE6D5; --on-accent:#FFFFFF;
  --ok:#0C8A79; --ok-soft:#D7F1EC; --bad:#D13A3A; --bad-soft:#FBE0E0; --star:#F2A900;
  --code-bg:#1A2340; --code-ink:#E6EBF5; --code-dim:#8994AE; --code-str:#FFB27E; --code-key:#93D5FF;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --grid:rgba(232,237,246,.045); --surface:#172036; --sunk:#111a2d;
  --ink:#E8EDF6; --muted:#9BA6BB; --line:#2B3651;
  --accent:#FF8B3E; --accent-soft:#3B2515; --on-accent:#1B0E04;
  --ok:#3CC6B1; --ok-soft:#10352F; --bad:#FF6E6E; --bad-soft:#3C1B1F; --star:#FFC233;
  --code-bg:#0A0F1D; --code-ink:#E6EBF5; --code-dim:#7D88A2; --code-str:#FFB27E; --code-key:#93D5FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1424; --grid:rgba(232,237,246,.045); --surface:#172036; --sunk:#111a2d;
  --ink:#E8EDF6; --muted:#9BA6BB; --line:#2B3651;
  --accent:#FF8B3E; --accent-soft:#3B2515; --on-accent:#1B0E04;
  --ok:#3CC6B1; --ok-soft:#10352F; --bad:#FF6E6E; --bad-soft:#3C1B1F; --star:#FFC233;
  --code-bg:#0A0F1D; --code-ink:#E6EBF5; --code-dim:#7D88A2; --code-str:#FFB27E; --code-key:#93D5FF;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{text-wrap:balance;margin:0}
code,.mono{font-family:var(--f-mono)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* Home */
.hero{padding-block:28px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,11vw,56px);line-height:1;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted)}
.pixrow{display:flex;gap:3px;margin-top:4px}
.pixrow i{width:10px;height:10px;border-radius:2px;background:var(--ink)}
.me{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:14px}
.me label{font-size:13px;color:var(--muted);white-space:nowrap}
.me input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);padding:4px 0}
.me .tot{font-family:var(--f-display);font-size:20px;color:var(--star);white-space:nowrap}
.stage-g{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.stage-g h3{font-family:var(--f-display);font-weight:400;font-size:22px;display:flex;gap:10px;align-items:baseline}
.stage-g h3 small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.lv{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:transform .12s}
.lv:active{transform:scale(.985)}
.lv .num{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;background:var(--sunk);color:var(--muted)}
.lv.open .num{background:var(--accent);color:var(--on-accent)}
.lv.done .num{background:var(--ok);color:var(--on-accent)}
.lv .tt{min-width:0}
.lv .tt b{display:block;font-size:17px}
.lv .tt span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.lv .st{font-size:15px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.lv .st .on{color:var(--star)}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked .num::after{content:"🔒";font-size:20px}
.lv.locked .num span{display:none}
.foot{margin-top:28px;display:grid;gap:10px;justify-items:center;color:var(--muted);font-size:13px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:6px}
.certcta{margin-top:20px}

/* Level */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.lvhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding-block:10px 8px;margin-inline:-4px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.lvt{min-width:0;line-height:1.25}
.lvt b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miss{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.miss.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.18);color:var(--bad);border-color:var(--bad)}}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:18px}
.stepno{margin:0;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.q{font-size:20px;line-height:1.45;font-weight:700}
.lead{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* Code */
.code,.log{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:13.5px;line-height:1.75;border-radius:var(--r);padding:14px;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.code .k{color:var(--code-key)} .code .s{color:var(--code-str)} .code .c{color:var(--code-dim)} .code .n{color:#B9E68C}
.code .ln{min-height:1.75em}
.log{font-size:12px;line-height:1.6;max-height:240px;overflow-y:auto;color:#CFD7E8}
.log b{color:var(--code-str);font-weight:600}
.blank{display:inline-block;min-width:4.2em;min-height:1.6em;vertical-align:middle;border:1.5px dashed var(--code-dim);border-radius:7px;background:rgba(255,255,255,.06);color:#fff;font-family:var(--f-mono);font-size:13px;padding:0 6px;margin:1px 0;cursor:pointer;line-height:1.5}
.blank.on{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.blank:not(.empty){border-style:solid;border-color:#5C6A8C;background:rgba(147,213,255,.14)}
.blank.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,transparent);animation:shake .35s}
.blank.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 30%,transparent)}
.pairs{display:grid;gap:10px}
.pairs .ln{display:grid;grid-template-columns:minmax(0,7.5em) 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.pairs code{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pairs .blank{width:100%;min-height:2.6em;font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--sunk);border-color:var(--line);text-align:left;padding:4px 10px}
.pairs .blank:not(.empty){background:var(--accent-soft);border-color:var(--accent)}
.pairs .blank.right{background:var(--ok-soft);border-color:var(--ok)}
.pairs .blank.wrong{background:var(--bad-soft);border-color:var(--bad)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--f-mono);font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--line);max-width:100%;overflow-wrap:anywhere;text-align:left}
.chip.kr{font-family:var(--f-body)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip:disabled{opacity:.45}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* MCQ */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;line-height:1.45}
.opt::before{content:"";flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;border:2px solid var(--line)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right::before{border-color:var(--ok);background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.wrong::before{border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.explain{border-radius:12px;padding:12px 14px;background:var(--ok-soft);border:1px solid var(--ok);line-height:1.55}
.explain b:first-child{color:var(--ok)}
.explain.warn{background:var(--accent-soft);border-color:var(--accent)}
.explain.warn b:first-child{color:var(--accent)}

/* Action bar */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:528px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer}
.btn.primary{width:100%;background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.run{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:14px;font-weight:600;justify-content:flex-start;width:100%;text-align:left}
.btn.run::before{content:"▶";color:var(--code-str)}
.btn.run:disabled{opacity:.6;background:var(--code-bg);color:var(--code-ink)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}

/* Widgets */
.pixwrap{display:grid;justify-items:center}
canvas.pix{width:100%;max-width:340px;aspect-ratio:1;border-radius:10px;touch-action:manipulation;background:#000}
.pixinfo{text-align:center;font-family:var(--f-mono);font-size:15px}
.pixinfo b{color:var(--accent);font-size:20px}
.rowstrip{font-family:var(--f-mono);font-size:11px;overflow-x:auto;white-space:nowrap;background:var(--sunk);border-radius:10px;padding:8px;color:var(--muted)}
.rowstrip span{display:inline-block;min-width:2.6em;text-align:right}
.rowstrip span.hi{color:var(--accent);font-weight:600}
.thumbs{width:100%;max-width:420px;image-rendering:pixelated;border-radius:8px;background:#000}
.slider{display:grid;gap:12px}
.slider input{width:100%;accent-color:var(--accent);height:32px}
.swatches{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.sw{width:72px;height:72px;border-radius:10px;border:1px solid var(--line)}
.eq{font-family:var(--f-mono);font-size:18px;line-height:1.5}
.eq b{color:var(--accent);font-size:24px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-bottom:0}
.tablebox{overflow-x:auto}
.net{width:100%;aspect-ratio:16/10;max-width:100%}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper label{font-size:14px;color:var(--muted);flex:1;min-width:8em}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer}
.stepper output{font-family:var(--f-display);font-size:28px;min-width:2ch;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-family:var(--f-mono);font-size:13px;cursor:pointer;line-height:1.35}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cfg{display:flex;flex-wrap:wrap;gap:6px}
.cfg span{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.chartbox{display:grid;gap:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
canvas.chart{width:100%;height:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok)}
.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.digits button{aspect-ratio:1.3;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:26px;cursor:pointer}
.digits button.right{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.digits button.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
.predrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.predrow canvas{width:96px;height:96px;image-rendering:pixelated;border-radius:8px;background:#000}
.padwrap{display:grid;gap:10px;justify-items:center}
canvas.pad{width:100%;max-width:300px;aspect-ratio:1;border-radius:14px;background:#000;touch-action:none;border:3px solid var(--line)}
.padbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;width:100%;max-width:300px}
.bars{display:grid;gap:5px}
.barrow{display:grid;grid-template-columns:1.4em 1fr 4.2em;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.barrow .tr{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--muted);border-radius:4px;transition:width .3s}
.barrow.top .tr i{background:var(--accent)}
.barrow.top{font-weight:600}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seen{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.seen canvas{width:56px;height:56px;image-rendering:pixelated;border-radius:6px;background:#000}
.big{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}

/* Overlay */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.ovc{background:var(--surface);border-radius:20px;padding:26px 20px;width:100%;max-width:420px;display:grid;gap:14px;text-align:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.9);opacity:.4}}
.ovc h2{font-family:var(--f-display);font-weight:400;font-size:34px}
.stars{font-size:46px;letter-spacing:6px;color:var(--line)}
.stars .on{color:var(--star);display:inline-block;animation:pop .4s backwards}
.stars .on:nth-child(2){animation-delay:.12s}.stars .on:nth-child(3){animation-delay:.24s}
.ovc .learned{background:var(--sunk);border-radius:12px;padding:12px;text-align:left;font-size:14px}
.ovc .btns{display:grid;gap:8px}

/* Certificate */
.cert{margin-top:24px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px 18px;display:grid;gap:14px;position:relative;overflow:hidden}
.cert h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1}
.cert .who{font-size:26px;font-weight:700}
.cert .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cert .grid div{background:var(--sunk);border-radius:8px;padding:6px;text-align:center;font-size:12px}
.cert .grid b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.cert .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cert .kpi div{border:1px solid var(--line);border-radius:12px;padding:10px}
.cert .kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tick=()=>new Promise(r=>setTimeout(r,0));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function shuffle(a,rnd=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const argmax=p=>{let b=0;for(let i=1;i<p.length;i++)if(p[i]>p[b])b=i;return b};
const f4=x=>x.toFixed(4);
const pyExp=x=>x.toExponential(7).replace(/e([+-])(\d)$/,"e$10$2");
function fitCanvas(c,h){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round((h||r.height)*d);const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);return{x,w:r.width,h:h||r.height}}

/* ---------- saved progress (this device only) ---------- */
const KEY="nnquest.v1";
let S={name:"",prog:{},unlock:false,best:null};
try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)S=Object.assign(S,v)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- practice digit data (handwriting fonts → MNIST-style 28×28) ---------- */
const FONTS=[
 {f:'"Gaegu"',w:700},{f:'"Gaegu"',w:400},{f:'"Nanum Pen Script"',w:400},{f:'"Gamja Flower"',w:400},
 {f:'"Hi Melody"',w:400},{f:'"Caveat"',w:700},{f:'"Caveat"',w:400},{f:'"Kalam"',w:400},{f:'"Kalam"',w:700},
 {f:'"Patrick Hand"',w:400},{f:'"Indie Flower"',w:400},{f:'"Shadows Into Light"',w:400},{f:'"Nanum Brush Script"',w:400},
 {f:'sans-serif',w:400},{f:'sans-serif',w:700}
];
let fontsReady=null;
function loadFonts(){
  if(fontsReady)return fontsReady;
  const all=Promise.all(FONTS.map(F=>document.fonts.load(`${F.w} 40px ${F.f}`,"0123456789").catch(()=>null)));
  fontsReady=Promise.race([all,new Promise(r=>setTimeout(r,5000))]);
  return fontsReady;
}
const SRC=128;
const srcC=document.createElement("canvas");srcC.width=srcC.height=SRC;
const srcX=srcC.getContext("2d",{willReadFrequently:true});
const midC=document.createElement("canvas");midC.width=midC.height=112;
const midX=midC.getContext("2d",{willReadFrequently:true});
const c28=document.createElement("canvas");c28.width=c28.height=28;
const x28=c28.getContext("2d",{willReadFrequently:true});

/* crop the ink, fit it into a 20×20 box, centre by mass in 28×28 (the MNIST recipe) */
function preprocess(src){
  const w=src.width,h=src.height,d=src.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;
  const bw=x1-x0+1,bh=y1-y0+1,s=80/Math.max(bw,bh),tw=Math.max(4,bw*s),th=Math.max(4,bh*s);
  midX.setTransform(1,0,0,1,0,0);midX.fillStyle="#000";midX.fillRect(0,0,112,112);
  midX.imageSmoothingEnabled=true;midX.imageSmoothingQuality="high";
  midX.drawImage(src,x0,y0,bw,bh,(112-tw)/2,(112-th)/2,tw,th);
  x28.fillStyle="#000";x28.fillRect(0,0,28,28);x28.imageSmoothingEnabled=true;x28.imageSmoothingQuality="high";
  x28.drawImage(midC,0,0,112,112,0,0,28,28);
  const g=x28.getImageData(0,0,28,28).data,a=new Float32Array(784);
  let m=0,cx=0,cy=0;
  for(let i=0;i<784;i++){const v=g[i*4]/255;a[i]=v;m+=v;cx+=v*(i%28);cy+=v*Math.floor(i/28)}
  if(m===0)return null;
  const dx=Math.round(13.5-cx/m),dy=Math.round(13.5-cy/m),out=new Float32Array(784);
  for(let y=0;y<28;y++)for(let x=0;x<28;x++){const sx=x-dx,sy=y-dy;if(sx>=0&&sx<28&&sy>=0&&sy<28)out[y*28+x]=a[sy*28+sx]}
  return out;
}
function renderSynth(d,rnd,font){
  const F=font||FONTS[Math.floor(rnd()*FONTS.length)];
  srcX.setTransform(1,0,0,1,0,0);srcX.fillStyle="#000";srcX.fillRect(0,0,SRC,SRC);
  srcX.translate(SRC/2,SRC/2);srcX.rotate((rnd()-.5)*.42);srcX.transform(1,0,(rnd()-.5)*.36,1,0,0);srcX.scale(.8+rnd()*.4,1);
  const size=62+rnd()*22;
  srcX.font=`${F.w} ${size}px ${F.f}`;srcX.textAlign="center";srcX.textBaseline="middle";
  srcX.fillStyle="#fff";srcX.fillText(String(d),0,0);
  const lw=rnd()*7;
  if(lw>1){srcX.strokeStyle="#fff";srcX.lineWidth=lw;srcX.lineJoin="round";srcX.strokeText(String(d),0,0)}
  return preprocess(srcC)||new Float32Array(784);
}
const ML={train:null,test:null,model:null,trainAcc:null,arch:null};
const N_TRAIN=3000,N_TEST=600;
let dataP=null;const dataListeners=new Set();
function ensureData(onProg){
  if(onProg)dataListeners.add(onProg);
  if(!dataP)dataP=(async()=>{
    await loadFonts();
    const total=N_TRAIN+N_TEST;let done=0;
    const gen=async(n,seed)=>{const rnd=mulberry32(seed),X=new Float32Array(n*784),Y=new Uint8Array(n);
      for(let i=0;i<n;i++){const d=i%10;Y[i]=d;X.set(renderSynth(d,rnd),i*784);done++;
        if(i%80===79){dataListeners.forEach(f=>f(done/total));await tick()}}
      return{X,Y,n}};
    ML.train=await gen(N_TRAIN,20261103);
    const T=await gen(N_TEST,777);
    // mix the test order; put a 7 first, like X_test[0] in the textbook
    const order=shuffle([...Array(N_TEST).keys()],mulberry32(5));
    const k=order.findIndex(i=>T.Y[i]===7);[order[0],order[k]]=[order[k],order[0]];
    const X=new Float32Array(N_TEST*784),Y=new Uint8Array(N_TEST);
    order.forEach((src,i)=>{X.set(T.X.subarray(src*784,src*784+784),i*784);Y[i]=T.Y[src]});
    ML.test={X,Y,n:N_TEST};
    dataListeners.forEach(f=>f(1));
  })();
  return dataP.then(()=>{if(onProg)dataListeners.delete(onProg)});
}

/* ---------- a real neural network (Dense layers, relu, softmax, adam) ---------- */
class MLP{
  constructor(sizes){
    this.sizes=sizes;this.L=sizes.length-1;
    this.W=[];this.b=[];this.gW=[];this.gb=[];this.mW=[];this.vW=[];this.mb=[];this.vb=[];
    this.a=sizes.map(s=>new Float32Array(s));this.d=sizes.map(s=>new Float32Array(s));this.t=0;
    for(let l=0;l<this.L;l++){const n=sizes[l],m=sizes[l+1],sd=Math.sqrt(2/n),W=new Float32Array(n*m);
      for(let k=0;k<W.length;k++)W[k]=gauss()*sd;
      this.W.push(W);this.b.push(new Float32Array(m));this.gW.push(new Float32Array(n*m));this.gb.push(new Float32Array(m));
      this.mW.push(new Float32Array(n*m));this.vW.push(new Float32Array(n*m));this.mb.push(new Float32Array(m));this.vb.push(new Float32Array(m))}
  }
  get params(){let p=0;for(let l=0;l<this.L;l++)p+=this.sizes[l]*this.sizes[l+1]+this.sizes[l+1];return p}
  forward(x){
    this.a[0]=x;
    for(let l=0;l<this.L;l++){const n=this.sizes[l],m=this.sizes[l+1],W=this.W[l],inp=this.a[l],out=this.a[l+1];
      out.set(this.b[l]);
      for(let j=0;j<n;j++){const v=inp[j];if(v===0)continue;const o=j*m;for(let i=0;i<m;i++)out[i]+=v*W[o+i]}
      if(l<this.L-1){for(let i=0;i<m;i++)if(out[i]<0)out[i]=0}
      else{let mx=-1e30;for(let i=0;i<m;i++)if(out[i]>mx)mx=out[i];let s=0;for(let i=0;i<m;i++){out[i]=Math.exp(out[i]-mx);s+=out[i]}for(let i=0;i<m;i++)out[i]/=s}
    }
    return this.a[this.L];
  }
  backward(y){
    const L=this.L,p=this.a[L],dL=this.d[L];
    for(let i=0;i<p.length;i++)dL[i]=p[i];dL[y]-=1;
    for(let l=L-1;l>=0;l--){const n=this.sizes[l],m=this.sizes[l+1],W=this.W[l],gW=this.gW[l],gb=this.gb[l],inp=this.a[l],dout=this.d[l+1];
      for(let i=0;i<m;i++)gb[i]+=dout[i];
      for(let j=0;j<n;j++){const v=inp[j];if(v===0)continue;const o=j*m;for(let i=0;i<m;i++)gW[o+i]+=v*dout[i]}
      if(l>0){const din=this.d[l];for(let j=0;j<n;j++){if(inp[j]<=0){din[j]=0;continue}const o=j*m;let s=0;for(let i=0;i<m;i++)s+=W[o+i]*dout[i];din[j]=s}}
    }
  }
  step(bs,lr=0.001){
    this.t++;const b1=.9,b2=.999,c1=1-Math.pow(b1,this.t),c2=1-Math.pow(b2,this.t);
    const upd=(P,G,M,V)=>{for(let k=0;k<P.length;k++){const g=G[k]/bs;M[k]=b1*M[k]+(1-b1)*g;V[k]=b2*V[k]+(1-b2)*g*g;P[k]-=lr*(M[k]/c1)/(Math.sqrt(V[k]/c2)+1e-7);G[k]=0}};
    for(let l=0;l<this.L;l++){upd(this.W[l],this.gW[l],this.mW[l],this.vW[l]);upd(this.b[l],this.gb[l],this.mb[l],this.vb[l])}
  }
  predict(x){return Float32Array.from(this.forward(x))}
}
async function fit(model,D,epochs,{bs=32,onBatch,onEpoch,alive}={}){
  const N=D.n,idx=[...Array(N).keys()],steps=Math.ceil(N/bs),hist=[];
  for(let e=0;e<epochs;e++){
    const ord=shuffle(idx);let loss=0,corr=0,seen=0,last=performance.now();const t0=last;
    for(let s=0;s<steps;s++){
      const st=s*bs,en=Math.min(N,st+bs);
      for(let k=st;k<en;k++){const i=ord[k],x=D.X.subarray(i*784,i*784+784),p=model.forward(x),y=D.Y[i];
        loss+=-Math.log(p[y]+1e-7);if(argmax(p)===y)corr++;seen++;model.backward(y)}
      model.step(en-st);
      if(performance.now()-last>45){if(alive&&!alive())throw new Error("stopped");onBatch&&onBatch(e,s+1,steps,loss/seen,corr/seen);await tick();last=performance.now()}
    }
    onBatch&&onBatch(e,steps,steps,loss/seen,corr/seen);
    hist.push({loss:loss/seen,acc:corr/seen,sec:(performance.now()-t0)/1000});
    onEpoch&&onEpoch(e,hist);await tick();
  }
  return hist;
}
function evaluate(model,D){let loss=0,corr=0;for(let i=0;i<D.n;i++){const p=model.forward(D.X.subarray(i*784,i*784+784));loss+=-Math.log(p[D.Y[i]]+1e-7);if(argmax(p)===D.Y[i])corr++}return{loss:loss/D.n,acc:corr/D.n}}
const kbar=(s,n)=>{const w=30,f=Math.round(w*s/n);return "["+"=".repeat(Math.max(0,f-(s<n?1:0)))+(s<n?">":"")+".".repeat(w-f)+"]"};

const GROUPS=[{t:"단계 1·2",s:"문제 정의 · 데이터 수집과 전처리",ids:[1,2,3]},{t:"단계 3",s:"신경망 모델 생성",ids:[4,5,6]},{t:"단계 4",s:"모델 평가와 예측",ids:[7,8]}];

/* ---------- screens ---------- */
const app=$("#app");
let cur=null,nav=0;
const starsOf=id=>(S.prog[id]||{}).stars||0;
const QUIZ=()=>LEVELS.filter(L=>!L.intro);
const MAXST=()=>QUIZ().length*3;
const totStars=()=>QUIZ().reduce((s,L)=>s+starsOf(L.id),0);
const unlocked=i=>S.unlock||i===0||starsOf(LEVELS[i-1].id)>0;
const allDone=()=>LEVELS.every(L=>starsOf(L.id)>0);
const starStr=n=>[0,1,2].map(i=>`<span class="${i<n?"on":""}">★</span>`).join("");

function renderHome(){
  nav++;cur=null;
  const tot=totStars();
  app.innerHTML=`
  <header class="hero">
    <span class="eyebrow">손으로 쓴 숫자 분류 모델 구현하기 (교과서 137p~) </span>
    <h1>신경망<br>학습 <em>퀘스트</em></h1>
    <p>코드를 직접 치지 않아도 괜찮아요. 블록을 채우고 문제를 풀면서 레벨을 깨면, 휴대폰 안에서 진짜 신경망이 숫자를 배워요.</p>
    <div class="me"><label for="nm">이름</label><input id="nm" maxlength="20" placeholder="이름을 적어 주세요" value="${esc(S.name)}" autocomplete="off"><span class="tot">★ ${tot} / ${MAXST()}</span></div>
  </header>
  ${allDone()?`<button class="btn primary certcta" id="cert">완주 카드 보기</button>`:""}
  ${GROUPS.map(g=>`<section class="stage-g"><h3>${g.t} <small>${g.s}</small></h3>
    ${g.ids.map(id=>{const i=LEVELS.findIndex(L=>L.id===id),L=LEVELS[i],st=starsOf(id),open=unlocked(i);
      return `<button class="lv ${st?"done":open?"open":"locked"}" data-i="${i}" ${open?"":'aria-disabled="true"'}>
        <span class="num"><span>${id}</span></span><span class="tt"><b>${L.title}</b><span>${L.goal}</span></span><span class="st">${L.intro?(st?`<span class="on" style="color:var(--ok)">✓ 읽음</span>`:"설명"):starStr(st)}</span></button>`}).join("")}
  </section>`).join("")}
  <div class="foot">
    <span>진행 상황은 이 기기에만 저장돼요.</span>
    <span>2026 중앙여고 인공지능기초</span>
  </div>`;
  $("#nm").addEventListener("input",e=>{S.name=e.target.value.trim();save()});
  $$(".lv").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i;if(unlocked(i))openLevel(i)}));
  $("#unl").addEventListener("click",()=>{S.unlock=!S.unlock;save();renderHome()});
  const c=$("#cert");if(c)c.addEventListener("click",renderCert);
  window.scrollTo(0,0);
}

function openLevel(i){
  nav++;cur={i,L:LEVELS[i],idx:0,mistakes:0};
  app.innerHTML=`
  <div class="lvhead"><button class="back" id="back" aria-label="레벨 지도로 돌아가기">←</button>
    <div class="lvt"><span class="eyebrow">LEVEL ${cur.L.id} · ${cur.L.stage}</span><b>${cur.L.title}</b></div>
    <span class="miss" id="miss" ${cur.L.intro?"hidden":""}>실수 0</span></div>
  <div class="bar"><i id="bar"></i></div>
  <main class="stage" id="stage"></main>
  <footer class="act"><div class="in"><button class="btn primary" id="go">다음</button></div></footer>`;
  $("#back").addEventListener("click",renderHome);
  renderStep();
}
function setGo(label,enabled,fn){const g=$("#go");if(!g)return;g.textContent=label;g.disabled=!enabled;g.onclick=fn||null}
function mistake(){if(!cur)return;cur.mistakes++;const m=$("#miss");m.textContent="실수 "+cur.mistakes;m.classList.remove("bump");void m.offsetWidth;m.classList.add("bump")}
function nextStep(){cur.idx++;if(cur.idx>=cur.L.steps.length)return finishLevel();renderStep()}
function renderStep(){
  nav++;const token=nav;
  const st=cur.L.steps[cur.idx],n=cur.L.steps.length;
  $("#bar").style.width=(cur.idx/n*100)+"%";
  const stage=$("#stage");
  stage.innerHTML=`<p class="stepno">${cur.idx+1} / ${n}</p><div id="box" class="stage" style="padding:0"></div>`;
  const box=$("#box");
  const api={done:()=>{if(token===nav)setGo("다음",true,nextStep)},mistake,alive:()=>token===nav,setGo:(l,e,f)=>{if(token===nav)setGo(l,e,f)}};
  if(st.type==="mcq")stepMCQ(st,box,api);
  else if(st.type==="fill")stepFill(st,box,api);
  else if(st.type==="info"){box.innerHTML=`<h2 class="q">${st.title}</h2>${st.html}`;setGo("다음",true,nextStep)}
  else{setGo("다음",false,nextStep);st.mount(box,api)}
  window.scrollTo(0,0);
}
function stepMCQ(st,box,api){
  box.innerHTML=`${st.code?`<pre class="code">${esc(st.code)}</pre>`:""}<h2 class="q">${st.q}</h2>
   <div class="opts">${st.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div class="explain" hidden></div>`;
  setGo("정답을 골라 주세요",false);
  let solved=false;
  $$(".opt",box).forEach(b=>b.addEventListener("click",()=>{
    if(solved)return;const i=+b.dataset.i;
    if(i===st.a){solved=true;b.classList.add("right");$$(".opt",box).forEach(o=>o.disabled=true);
      const ex=$(".explain",box);ex.innerHTML=`<b>정답!</b> ${st.ex}`;ex.hidden=false;api.setGo("다음",true,nextStep);ex.scrollIntoView({block:"nearest",behavior:"smooth"})}
    else{b.classList.add("wrong");b.disabled=true;mistake()}
  }));
}
function stepFill(st,box,api){
  const filled=st.ans.map(()=>null);let active=0,solved=false;
  const pairs=st.style==="pairs";
  const bank=shuffle([...new Set(st.bank||st.ans)]);
  box.innerHTML=`<h2 class="q">${st.q}</h2>
   <div class="${pairs?"pairs":"code"}">${st.lines.map(l=>`<div class="ln">${l.replace(/\{\{(\d+)\}\}/g,(m,k)=>`<button class="blank empty" data-k="${k}" aria-label="빈칸 ${+k+1}"></button>`)}</div>`).join("")}</div>
   <p class="hint">빈칸을 누른 다음, 아래 블록을 골라 넣으세요. 채운 빈칸을 다시 누르면 비워져요.</p>
   <div class="bank">${bank.map(c=>`<button class="chip ${pairs?"kr":""}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
   <div class="explain" hidden></div>`;
  const blanks=$$(".blank",box);
  function paint(){
    blanks.forEach(b=>{const k=+b.dataset.k;b.textContent=filled[k]??"";b.classList.toggle("empty",filled[k]==null);b.classList.toggle("on",k===active&&!solved)});
    if(!solved)api.setGo(filled.every(v=>v!=null)?"확인하기":"빈칸을 모두 채워 주세요",filled.every(v=>v!=null),check);
  }
  blanks.forEach(b=>b.addEventListener("click",()=>{if(solved)return;const k=+b.dataset.k;if(filled[k]!=null&&active===k){filled[k]=null}active=k;b.classList.remove("wrong");paint()}));
  $$(".chip",box).forEach(c=>c.addEventListener("click",()=>{
    if(solved)return;filled[active]=c.dataset.v;blanks.find(b=>+b.dataset.k===active).classList.remove("wrong");
    for(let s=1;s<=filled.length;s++){const k=(active+s)%filled.length;if(filled[k]==null){active=k;break}}
    paint();
  }));
  function check(){
    const wrong=filled.map((v,k)=>v===st.ans[k]?-1:k).filter(k=>k>=0);

function drawChart(cv,hist,E){
  const {x,w,h}=fitCanvas(cv,190);x.clearRect(0,0,w,h);
  const L=36,R=12,T=12,B=26,pw=w-L-R,ph=h-T-B;

  const mut=cssv("--muted"),ln=cssv("--line"),ac=cssv("--accent"),ok=cssv("--ok");
  x.font=`11px ${cssv("--f-mono")}`;x.fillStyle=mut;x.strokeStyle=ln;x.lineWidth=1;
  for(let k=0;k<=4;k++){const v=ymax*k/4,y=T+ph-ph*k/4;x.beginPath();x.moveTo(L,y);x.lineTo(L+pw,y);x.stroke();x.textAlign="right";x.fillText(v.toFixed(2),L-5,y+4)}
  const xs=e=>L+(E<=1?pw/2:pw*e/(E-1));
  x.textAlign="center";for(let e=0;e<E;e++)if(E<=10||e%2===0)x.fillText(String(e+1),xs(e),h-8);
  const line=(key,col)=>{x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2.5;x.beginPath();hist.forEach((d,e)=>{const y=T+ph-ph*d[key]/ymax;e?x.lineTo(xs(e),y):x.moveTo(xs(e),y)});x.stroke();
    hist.forEach((d,e)=>{x.beginPath();x.arc(xs(e),T+ph-ph*d[key]/ymax,e===hist.length-1?4.5:3,0,7);x.fill()})};
  line("loss",ac);line("acc",ok);
}
function trainUI(box,{arch,epochs,api,onDone,quiet}){

  log.hidden=false;if(chart)chart.parentElement.hidden=false;
  return (async()=>{
    lines.push("연습 데이터 준비 중 ...");render();
    await ensureData(p=>{lines[lines.length-1]=`연습 데이터 준비 중 ... ${Math.round(p*100)}%`;render()});
    if(!api.alive())return null;
    lines.length=0;
    const model=new MLP([784,...arch,10]);
    let hist=[],curE=-1;
    try{
      hist=await fit(model,ML.train,epochs,{alive:api.alive,
        onBatch:(e,s,n,l,a)=>{if(e!==curE){curE=e;lines.push(`Epoch ${e+1}/${epochs}`,"")}
          lines[lines.length-1]=`${s}/${n} ${kbar(s,n)} - loss: ${f4(l)} - accuracy: <b>${f4(a)}</b>`;render()},
        onEpoch:(e,h)=>{hist=h;if(chart)drawChart(chart,h,epochs)}});
    }catch(err){return null}
    if(!api.alive())return null;
    ML.model=model;ML.trainAcc=hist[hist.length-1].acc;ML.arch=arch;
    return {model,hist};
  })();
}

function mountPredict(box,api){
  box.innerHTML=`<h2 class="q">predict 결과에서 예측 숫자 찾기</h2><p class="lead">출력층 10개 노드의 확률값이 0번부터 9번까지 차례로 나와요. 가장 큰 값은 몇 번 인덱스일까요?</p><div id="w" class="stage" style="padding:0"></div>`;
  const w=$("#w",box);
  needModel(w,api,()=>{
    const picks=[0];const rnd=Math.random;while(picks.length<3){const k=1+Math.floor(rnd()*(N_TEST-1));if(!picks.includes(k))picks.push(k)}
    let r=0;
    const show=()=>{
      const i=picks[r],p=ML.model.predict(sampleOf(ML.test,i)),am=argmax(p),y=ML.test.Y[i];
      w.innerHTML=`<p class="stepno">문제 ${r+1} / 3</p>
       <div class="predrow"><canvas id="im"></canvas><div><code>X_test[${i}]</code><p class="note">정답 레이블은 맞힌 다음에 알려 줄게요.</p></div></div>
       <pre class="code">predictions[${i}]
array([${Array.from(p).map(pyExp).join(", ")}], dtype=float32)</pre>
       <p style="margin:0;font-weight:700">가장 큰 값의 인덱스 (np.argmax)는?</p>
       <div class="digits">${[...Array(10).keys()].map(d=>`<button data-d="${d}">${d}</button>`).join("")}</div><div id="fb"></div>`;
      drawDigit($("#im",w),sampleOf(ML.test,i),4);
      let ok=false;
      $$(".digits button",w).forEach(b=>b.addEventListener("click",()=>{
        if(ok)return;const d=+b.dataset.d;
        if(d===am){ok=true;b.classList.add("right");
          $("#fb",w).innerHTML=`<div class="explain"><b>정답!</b> ${am}번 값이 ${pyExp(p[am])}로 가장 커서 모델은 <b>${am}</b>(으)로 예측해요. 실제 정답(y_test[${i}])은 ${y}${y===am?"이라 모델이 맞혔어요.":"이에요. 모델이 틀렸네요!"}</div>`;
          if(r<2)api.setGo("다음 문제",true,()=>{r++;show();api.setGo("인덱스를 골라 주세요",false)});else api.done()}
        else{b.classList.add("wrong");mistake();$("#fb",w).innerHTML=`<div class="explain warn"><b>다시!</b> e-01은 ×1/10, e-12는 ×1/10¹²이에요. 지수(e 뒤의 숫자)가 0에 가장 가까운 값을 찾아보세요.</div>`}
      }));
    };
    show();api.setGo("인덱스를 골라 주세요",false);
  });
}
function mountDraw(box,api){
  box.innerHTML=`<h2 class="q">내가 쓴 숫자를 분류해 봐요</h2><p class="lead">검은 칸에 숫자 하나를 크게 쓰고 '예측하기'를 누르세요. 숫자 3개를 시험해 보면 통과예요.</p><div id="w" class="stage" style="padding:0"></div>`;
  const w=$("#w",box);
  needModel(w,api,()=>{
    let tries=0,hits=0;
    w.innerHTML=`<div class="padwrap"><canvas class="pad" id="pad" width="280" height="280" aria-label="숫자를 쓰는 칸"></canvas>
      <div class="padbtns"><button class="btn ghost" id="clr">지우기</button><button class="btn primary" id="pr" style="box-shadow:none">예측하기</button></div></div>
      <div id="res"></div><p class="note" id="cnt">시험한 숫자 0 / 3</p>`;
    const pad=$("#pad",w),px=pad.getContext("2d",{willReadFrequently:true});
    const clear=()=>{px.fillStyle="#000";px.fillRect(0,0,280,280)};clear();
    let drawing=false,last=null,inked=false,judged=true;
    const pt=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)/r.width*280,(e.clientY-r.top)/r.height*280]};
    pad.addEventListener("pointerdown",e=>{drawing=true;last=pt(e);pad.setPointerCapture(e.pointerId);px.fillStyle="#fff";px.beginPath();px.arc(last[0],last[1],11,0,7);px.fill();inked=true});
    pad.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);px.strokeStyle="#fff";px.lineWidth=22;px.lineCap="round";px.lineJoin="round";px.beginPath();px.moveTo(last[0],last[1]);px.lineTo(p[0],p[1]);px.stroke();last=p});
    const up=()=>{drawing=false};pad.addEventListener("pointerup",up);pad.addEventListener("pointercancel",up);
    $("#clr",w).onclick=()=>{clear();inked=false;$("#res",w).innerHTML=""};
    $("#pr",w).onclick=()=>{
      if(!inked){$("#res",w).innerHTML=`<div class="explain warn"><b>먼저 숫자를 써 주세요.</b></div>`;return}
      if(!judged){$("#res",w).querySelector(".verdict")?.scrollIntoView({block:"nearest",behavior:"smooth"});return}
      const a=preprocess(pad);if(!a)return;const p=ML.model.predict(a),am=argmax(p);judged=false;
      $("#res",w).innerHTML=`<div class="card stage" style="padding:14px">
        <div style="display:flex;gap:14px;align-items:center"><div class="big">${am}</div><div><b>AI의 예측: ${am}</b><br><span class="note">확률 ${(p[am]*100).toFixed(1)}%</span></div>
        <div class="seen" style="margin-left:auto"><canvas id="seen"></canvas></div></div>
        <p class="note">오른쪽 작은 그림이 모델이 실제로 본 28×28 숫자예요.</p>
        <div class="bars">${Array.from(p).map((v,d)=>`<div class="barrow ${d===am?"top":""}"><span>${d}</span><span class="tr"><i style="width:${(v*100).toFixed(1)}%"></i></span><span>${(v*100).toFixed(1)}%</span></div>`).join("")}</div>
        <p style="margin:0;font-weight:700">AI가 맞혔나요?</p>
        <div class="verdict"><button class="btn ghost" data-v="1">맞혔어요</button><button class="btn ghost" data-v="0">틀렸어요</button></div></div>`;
      drawDigit($("#seen",w),a,2);
      $$(".verdict button",w).forEach(b=>b.onclick=()=>{
        if(judged)return;judged=true;tries++;if(b.dataset.v==="1")hits++;
        $$(".verdict button",w).forEach(x=>x.disabled=true);b.style.borderColor="var(--accent)";
        $("#cnt",w).textContent=`시험한 숫자 ${tries} / 3 · AI가 맞힌 숫자 ${hits}개`;
        clear();inked=false;
        if(tries>=3)api.done();
      });
    };
  });
}
function mountChallenge(box,api){
  const ARCH=[{a:[64],t:"64"},{a:[128],t:"128"},{a:[128,64],t:"128 → 64\n(교과서)"},{a:[256,128],t:"256 → 128"}];
  let ai=2,E=5;const rows=[];
  box.innerHTML=`<h2 class="q">성능 높이기 도전</h2>
  <p class="lead">은닉층과 반복 학습 횟수를 바꿔서 학습하고 테스트 정확도를 비교해 보세요. 두 번 이상 실험하면 통과예요.</p>
  <div class="card stage" style="padding:14px">
    <b>은닉층 노드 구성</b><div class="seg" id="seg">${ARCH.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===ai}">${x.t.replace("\n","<br>")}</button>`).join("")}</div>
    <div class="stepper"><label>epochs (반복 횟수)</label><button id="dn" aria-label="줄이기">−</button><output id="ep">${E}</output><button id="upb" aria-label="늘리기">+</button></div>
    <button class="btn run" id="run">학습하고 평가하기</button>
  </div>
  <pre class="log" id="log" hidden></pre>
  <div id="tbl"></div>`;
  $$("#seg button",box).forEach(b=>b.onclick=()=>{ai=+b.dataset.i;$$("#seg button",box).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const lbl=()=>$("#ep",box).textContent=E;
  $("#dn",box).onclick=()=>{E=Math.max(1,E-1);lbl()};$("#upb",box).onclick=()=>{E=Math.min(10,E+1);lbl()};
  const lock=v=>{$("#run",box).disabled=v;$("#dn",box).disabled=$("#upb",box).disabled=v;$$("#seg button",box).forEach(b=>b.disabled=v)};
  api.setGo("두 번 이상 실험해 주세요",false);
  $("#run",box).addEventListener("click",async()=>{
    lock(true);const A=ARCH[ai],t0=performance.now();
    const r=await trainUI(box,{arch:A.a,epochs:E,api});
    if(!r||!api.alive())return;
    const ev=evaluate(r.model,ML.test);S.best=Math.max(S.best||0,ev.acc);save();
    rows.push({t:A.t.replace("\n"," "),E,tr:r.hist[r.hist.length-1].acc,te:ev.acc,s:(performance.now()-t0)/1000});
    const best=Math.max(...rows.map(x=>x.te));
    $("#tbl",box).innerHTML=`<div class="card tablebox"><table class="t"><thead><tr><th>은닉층</th><th class="n">epochs</th><th class="n">훈련</th><th class="n">테스트</th><th class="n">시간</th></tr></thead>
      <tbody>${rows.map(x=>`<tr${x.te===best?' style="font-weight:700"':""}><td>${x.t}${x.te===best?" ★":""}</td><td class="n">${x.E}</td><td class="n">${f4(x.tr)}</td><td class="n">${f4(x.te)}</td><td class="n">${x.s.toFixed(0)}초</td></tr>`).join("")}</tbody></table></div>
      <p class="note">★ 테스트 정확도가 가장 높은 설정이에요. 훈련 정확도와 테스트 정확도의 차이도 비교해 보세요.</p>`;
    lock(false);
    if(rows.length>=2)api.done();else api.setGo("한 번 더 실험해 주세요",false);
  });
}
